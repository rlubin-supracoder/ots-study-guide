name: Tether checks
on:
  push:
    paths: ['tether/**', '.github/workflows/tether-checks.yml']
  pull_request:
    paths: ['tether/**', '.github/workflows/tether-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tether
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: pnpm test:runtime
