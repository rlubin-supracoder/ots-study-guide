<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Orbit Hop</title>
  <link rel="stylesheet" href="space-jump.css">
</head>
<body>
  <header class="hud">
    <div><span class="hud-label">ALTITUDE</span><strong id="score">0 <small>m</small></strong></div>
    <div class="best"><span class="hud-label">PERSONAL BEST</span><strong id="best">0 <small>m</small></strong></div>
  </header>
  <main class="arena" id="arena">
    <div class="stage" id="stage">
      <canvas id="game" width="420" height="600" tabindex="0" aria-label="Orbit Hop. Use left and right arrows or A and D to steer. You jump automatically. Touch controls are below."></canvas>
      <section id="overlay" class="overlay" aria-live="polite">
        <span class="eyebrow">27-01 / OFF DUTY</span>
        <h1 id="overlayTitle">ORBIT<br>HOP</h1>
        <p id="overlayText">Keep climbing. Find your next landing.</p>
        <button id="play" type="button" disabled>Preparing launch…</button>
        <p class="instructions" id="instructions">← → or A / D to steer<br>Jumping is automatic. Wrap around the edges.<br>Touch: hold the left or right control below.</p>
      </section>
    </div>
  </main>
  <footer class="controls">
    <button id="left" type="button" aria-label="Move left">←</button>
    <button id="pause" type="button" aria-label="Pause game" disabled>PAUSE</button>
    <button id="right" type="button" aria-label="Move right">→</button>
  </footer>
  <script type="module" src="space-jump.js"></script>
</body>
</html>
